name: Build desktop artifacts

on:
  workflow_dispatch:
  create:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            command: npm run dist:mac -- --arm64 --publish never
            artifact: Moto4D-macOS-arm64
          - os: macos-latest
            architecture: x64
            command: npm run dist:mac -- --x64 --publish never
            artifact: Moto4D-macOS-x64
          - os: windows-latest
            architecture: x64
            command: npm run dist:win -- --publish never
            artifact: Moto4D-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish-release:
    if: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Remove incomplete draft release
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release delete v0.1.1 --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: Moto4D Studio v0.1.1
          target_commitish: main
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.blockmap
            release-assets/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
